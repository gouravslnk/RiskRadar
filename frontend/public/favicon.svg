<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sweepGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.45" />
    </linearGradient>
    <radialGradient id="hazardGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="1" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Rounded Background -->
  <rect width="64" height="64" rx="14" fill="#090A0F" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#1E2330" stroke-width="1.5" />
  
  <!-- Crosshairs -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="3 3" />
  <line x1="8" y1="32" x2="56" y2="32" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="3 3" />

  <!-- Radar Concentric Rings -->
  <circle cx="32" cy="32" r="24" stroke="#10B981" stroke-width="2" stroke-opacity="0.25" />
  <circle cx="32" cy="32" r="16" stroke="#10B981" stroke-width="2" stroke-opacity="0.45" />
  <circle cx="32" cy="32" r="8" stroke="#10B981" stroke-width="2" stroke-opacity="0.7" />

  <!-- Radar Sweep Cone -->
  <path d="M 32 32 L 56 32 A 24 24 0 0 0 48.97 15.03 Z" fill="url(#sweepGrad)" />
  <line x1="32" y1="32" x2="48.97" y2="15.03" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" />

  <!-- Center Pulse / Origin -->
  <circle cx="32" cy="32" r="3.5" fill="#10B981" />
  <circle cx="32" cy="32" r="6" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Hazard Alert Blip (Tracked Acute Threat) -->
  <circle cx="44" cy="20" r="3.5" fill="#EF4444" />
  <circle cx="44" cy="20" r="6" stroke="#F87171" stroke-width="1.5" stroke-opacity="0.8" />
</svg>